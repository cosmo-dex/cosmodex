name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, closed, synchronize]
    branches: [ "main" ]

jobs:
  # ---------------------------------------------------------
  # JOB 1: The Quality Gate
  # ---------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- NOTIFICATION: PR OPENED ---
      - name: Discord Alert - PR Opened
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        run: |
          MSG="🔔 **New Pull Request!** \n**Author:** ${{ github.actor }}\n**Title:** ${{ github.event.pull_request.title }}\n**Link:** ${{ github.event.pull_request.html_url }}"
          curl -H "Content-Type: application/json" -d "{\"content\": \"$MSG\"}" ${{ secrets.DISCORD_WEBHOOK }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript Type Check
        run: pnpm exec tsc --noEmit

      # --- NOTIFICATION: BUILD FAILED ---
      - name: Discord Alert - Quality Gate Failed
        if: failure()
        run: |
          MSG="🚨 **CRITICAL: Quality Gate Failed!**\nCode from **${{ github.actor }}** failed linting or type-checking. Deployment blocked.\n**Check logs:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -H "Content-Type: application/json" -d "{\"content\": \"$MSG\"}" ${{ secrets.DISCORD_WEBHOOK }}

  # ---------------------------------------------------------
  # JOB 2: Google Cloud Run Deployment
  # ---------------------------------------------------------
  deploy-production:
    name: Deploy to Google Cloud Run
    needs: lint-and-typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: us-central1
      SERVICE_NAME: cosmodex
      IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/cosmodex

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- NOTIFICATION: DEPLOY STARTING ---
      - name: Discord Alert - Deploy Started
        run: |
          MSG="🚀 **Code Merged to Main!**\nStarting Google Cloud Run Deployment for **${{ github.repository }}**..."
          curl -H "Content-Type: application/json" -d "{\"content\": \"$MSG\"}" ${{ secrets.DISCORD_WEBHOOK }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg BATTLE_ARENA_URL=${{ secrets.NEXT_PUBLIC_BATTLE_ARENA_URL }} \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .

      - name: Push Docker Image to GCR
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 3000

      # --- NOTIFICATION: DEPLOY SUCCESS ---
      - name: Discord Alert - Deploy Success
        if: success()
        run: |
          MSG="✅ **Deployment Successful!**\nYour latest code is now live on Google Cloud Run."
          curl -H "Content-Type: application/json" -d "{\"content\": \"$MSG\"}" ${{ secrets.DISCORD_WEBHOOK }}

      # --- NOTIFICATION: DEPLOY FAILED ---
      - name: Discord Alert - Deploy Failed
        if: failure()
        run: |
          MSG="🔴 **URGENT: Deployment Failed!**\nThe Cloud Run build crashed.\n**Check logs:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -H "Content-Type: application/json" -d "{\"content\": \"$MSG\"}" ${{ secrets.DISCORD_WEBHOOK }}
